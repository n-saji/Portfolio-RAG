name: Deploy to ECR & Update Lambda

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: 080050138880.dkr.ecr.us-east-2.amazonaws.com
  ECR_REPOSITORY: portfolio/rag
  LAMBDA_FUNCTION: rag-portfolio

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          PYTHONPATH=. python scripts/build_chunks.py
          OPENAI_API_KEY='' PINECONE_API_KEY='' PYTHONPATH=. python scripts/evaluate.py

  deploy:
    if: github.event_name == 'push'
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test RAG
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          PYTHONPATH=. python scripts/build_chunks.py
          OPENAI_API_KEY='' PINECONE_API_KEY='' PYTHONPATH=. python scripts/evaluate.py

      - name: Stage and activate reviewed index
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          PINECONE_DIMENSIONS: "1024"
        run: PYTHONPATH=. python scripts/build_index.py --namespace portfolio-${{ github.sha }} --activate

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            --no-cache \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
            .

      - name: Push image to ECR
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Update Lambda function
        run: |
          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION \
            --image-uri $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --region $AWS_REGION

name: Deploy to ECR & Update Lambda

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: 993371733162.dkr.ecr.us-east-2.amazonaws.com
  ECR_REPOSITORY: portfolio/rag
  LAMBDA_FUNCTION: rag-portfolio

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ECR_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ECR_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Lambda-compatible image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --no-cache \
            --provenance=false \
            --sbom=false \
            --output "type=image,name=$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }},push=true,oci-mediatypes=false" \
            .

      - name: Configure Lambda deployment credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_LAMBDA_DEPLOY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_LAMBDA_DEPLOY_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Lambda function
        run: |
          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION \
            --image-uri $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
            --region $AWS_REGION
          aws lambda wait function-updated-v2 \
            --function-name $LAMBDA_FUNCTION \
            --region $AWS_REGION

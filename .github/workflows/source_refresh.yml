name: Review public source updates

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'pypdf>=6,<7'
      - run: python scripts/refresh_sources.py
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: codex/review-public-sources
          delete-branch: true
          commit-message: "Review updated public portfolio sources"
          title: "Review updated resume and GitHub facts"
          body: |
            Review the changed resume text and repository metadata for public accuracy.
            If current-role details changed, update `data/approved/facts.json` in this PR before merging.
            Merge approves the source snapshot for the next index build; no visitor request fetches these sources live.
          add-paths: data/approved/sources.json

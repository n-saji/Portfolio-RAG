name: Refresh portfolio knowledge

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-2
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_LAMBDA_DEPLOY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_LAMBDA_DEPLOY_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Set portfolio provider configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          PINECONE_DIMENSIONS: "1024"
        run: |
          echo "OPENAI_API_KEY=$OPENAI_API_KEY" >> "$GITHUB_ENV"
          echo "PINECONE_API_KEY=$PINECONE_API_KEY" >> "$GITHUB_ENV"
          echo "PINECONE_INDEX_NAME=$PINECONE_INDEX_NAME" >> "$GITHUB_ENV"
          echo "PINECONE_DIMENSIONS=$PINECONE_DIMENSIONS" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pip install -r requirements.lock
      - name: Fetch resume, portfolio and GitHub sources
        run: python scripts/refresh_sources.py
      - name: Build, verify and activate Pinecone namespace
        run: python scripts/refresh_index.py --activate
